- status: completed
  period: "2023 - 2024"
  title: "Clinical and genetic differences for identifying hypertension-progression risk groups in hyperlipidemia patients (KoGES cohort)"
  title_ko: "KoGES 코호트 기반 고지혈증 환자의 고혈압 진행 위험군 규명을 위한 임상·유전적 차이 분석 연구"
  summary: "In the KoGES Ansan–Ansung community cohort from the Korea Disease Control and Prevention Agency (adults aged 40–69, 10,030 participants, 9 follow-up waves), hypertension had the highest treatment history in every wave, and hyperlipidemia treatment grew wave over wave. The goal was to find clinical and genetic differences between hyperlipidemia patients who go on to develop hypertension and those who do not, by building a hypertension-onset prediction model. The core challenge was labeling: treatment status came from questionnaires and was unreliable, so labels had to be rebuilt from lab and blood-pressure measurements."
  summary_ko: "질병관리청 KoGES 안산·안성 지역사회 코호트(40–69세, 10,030명, 9차 추적)에서 차수별 치료력을 보면 고혈압이 모든 차수에서 가장 높았고, 고지혈증 치료력은 차수가 지날수록 늘었습니다. 이를 바탕으로 고지혈증 환자 중 고혈압이 발생하는 경우와 발생하지 않는 경우의 임상·유전적 차이를 고혈압 발생 예측 모델로 규명하고자 했습니다. 핵심 난제는 라벨링으로, 설문으로 수집된 치료 여부는 신뢰도가 낮아 혈액검사·혈압 수치 기반으로 라벨을 다시 설계했습니다."
  role:
    - "Designed measurement-based labels: hyperlipidemia from TC, HDL, and TG; hypertension from the two-arm average of SBP/DBP; handled raw vs. converted lab values and compared labels by missing-value order (drop-then-label vs. label-then-drop)"
    - "Built a hyperlipidemia→hypertension (n=812) vs. normotensive (n=1,034) dataset and trained XGBoost, CatBoost, and TabNet classifiers (XGBoost accuracy/F1 0.67)"
    - "Selected top SNPs from Korean Biobank Array (K-chip) genotypes by logistic-regression p-value and tested their added value over clinical features"
  role_ko:
    - "수치 기반 라벨링 설계: 고지혈증(TC·HDL·TG), 고혈압(양팔 평균 SBP/DBP) 기준, 원 측정값·변환값 처리, 결측 처리 순서(선 결측 제거 / 선 기준 적용)별 라벨 비교"
    - "선 고지혈증 → 후 고혈압(812명) vs 정상혈압 유지(1,034명) 데이터셋 구축 및 XGBoost·CatBoost·TabNet 분류 (XGBoost acc/F1 0.67)"
    - "Korean Biobank Array(K-chip) 유전정보에서 로지스틱 회귀 p-value 기반 상위 SNP 선별 후 임상 변수 대비 추가 효과 검증"
  tags: [KoGES, Cohort Study, Data Labeling, XGBoost, SNP]

- status: completed
  period: "2022"
  title: "Customs notice analysis and monitoring system for global supply-chain crises"
  title_ko: "글로벌 공급망 위기 대응을 위한 세관 고시 분석 및 모니터링 시스템 개발"
  summary: "Built with KOTRA in response to the 2021 urea-solution shortage: crawls foreign customs notices daily, extracts item keywords with NLP, matches them to monitored items and industries, and delivers the results through a web service."
  summary_ko: "2021년 요소수 대란 같은 공급망 위기를 막기 위해 KOTRA와 연계해 구상한 시스템. 해외 관세청 세관 고시를 매일 수집하고, NLP 키워드 추출과 품목·산업군 매칭으로 국내 영향을 분석해 웹 서비스로 제공합니다."
  role:
    - "Scraping customs notices (Japan, Australia)"
    - "Data preprocessing"
    - "Testing and results analysis"
  role_ko:
    - "해외 세관 고시 스크래핑 (일본, 호주)"
    - "데이터 전처리"
    - "테스트 및 결과 분석"
  tags: [Web Scraping, NLP, Supply Chain, Web Service]
  links:
    code: "https://github.com/janghyunnoh/customs-notification-analysis-and-monitoring-system-main"
