- status: completed
  period: "2023 - 2024"
  title: "Clinical and genetic differences for identifying hypertension-progression risk groups in hyperlipidemia patients (KoGES cohort)"
  title_ko: "KoGES 코호트 기반 고지혈증 환자의 고혈압 진행 위험군 규명을 위한 임상·유전적 차이 분석 연구"
  summary: "Hypertension and hyperlipidemia often occur together: roughly half of patients with one also have the other. Using the KoGES Ansan–Ansung cohort (9 follow-up waves, 10,030 participants), we predicted which hyperlipidemia patients progress to hypertension and analyzed the clinical and genetic differences. The core challenge was labeling: it was unclear whether to trust self-reported questionnaires (diagnosis and medication history) or clinical lab values (lipids, blood pressure) as ground truth."
  summary_ko: "고혈압과 고지혈증은 환자의 절반가량이 서로를 동반할 만큼 함께 나타나는 질환입니다. KoGES 안산·안성 코호트(1–9기 추적, 10,030명)로 고지혈증 환자 중 고혈압으로 진행하는 위험군을 예측하고 임상·유전적 차이를 분석했습니다. 핵심 난제는 라벨링으로, 개인 문진(진단·약물력)과 임상 검사(지질·혈압 수치) 중 어느 쪽을 진단 근거로 신뢰할지가 명확하지 않았습니다."
  role:
    - "Designed hyperlipidemia and hypertension labeling criteria by comparing questionnaire and clinical-lab data (first-diagnosis wave, missing values)"
    - "Built a hyperlipidemia→hypertension (n=812) vs. normotensive (n=1,034) dataset and trained XGBoost, CatBoost, and TabNet classifiers (XGBoost accuracy/F1 0.67)"
    - "Selected top SNPs from K-chip genotypes (467K positions) and tested their added value over clinical features"
  role_ko:
    - "문진 vs 임상 검사 비교를 통한 고지혈증·고혈압 라벨링 기준 설계 (최초 진단 차수, 결측 처리)"
    - "선 고지혈증 → 후 고혈압(812명) vs 정상혈압 유지(1,034명) 데이터셋 구축 및 XGBoost·CatBoost·TabNet 분류 (XGBoost acc/F1 0.67)"
    - "K-chip SNP(46.7만 위치)에서 상위 SNP 선별 후 임상 변수 대비 추가 효과 검증"
  tags: [Cohort Study, Data Labeling, XGBoost, SNP]

- status: completed
  period: "2022"
  title: "Customs notice analysis and monitoring system for global supply-chain crises"
  title_ko: "글로벌 공급망 위기 대응을 위한 세관 고시 분석 및 모니터링 시스템 개발"
  summary: "Built with KOTRA in response to the 2021 urea-solution shortage: crawls foreign customs notices daily, extracts item keywords with NLP, matches them to monitored items and industries, and delivers the results through a web service."
  summary_ko: "2021년 요소수 대란 같은 공급망 위기를 막기 위해 KOTRA와 연계해 구상한 시스템. 해외 관세청 세관 고시를 매일 수집하고, NLP 키워드 추출과 품목·산업군 매칭으로 국내 영향을 분석해 웹 서비스로 제공합니다."
  role:
    - "Scraping customs notices (Japan, Australia)"
    - "Data preprocessing"
    - "Testing and results analysis"
  role_ko:
    - "해외 세관 고시 스크래핑 (일본, 호주)"
    - "데이터 전처리"
    - "테스트 및 결과 분석"
  tags: [Web Scraping, NLP, Supply Chain, Web Service]
  links:
    code: "https://github.com/janghyunnoh/customs-notification-analysis-and-monitoring-system-main"
