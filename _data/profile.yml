about: >-
  Hi, I'm Janghyun Noh! I received my M.S. in Artificial Intelligence from Myongji University, where I was advised by
  Prof. <a href="https://minsik-bioinfo.github.io/online-cv/">Minsik Oh</a> in the
  <a href="https://ailab-mju.github.io/">Artificial Intelligence and Data Analytics (AIDA) Lab</a>.
  I enjoy turning complex real-world data into AI solutions, from multimodal prediction models to large-scale data analysis,
  and have worked with hospitals, public agencies, and industry partners along the way.
  I'm currently looking for opportunities as an AI researcher or data scientist.
about_ko: >-
  안녕하세요, 노장현입니다! 명지대학교 인공지능학과에서 <a href="https://minsik-bioinfo.github.io/online-cv/">오민식 교수님</a>의 지도 아래
  <a href="https://ailab-mju.github.io/">인공지능 및 데이터 분석(AIDA) 연구실</a>에서 석사 학위를 받았습니다.
  복잡한 실제 데이터를 AI로 풀어 현실의 문제를 해결하는 일에 관심이 많으며, 병원·공공기관·기업과 협업하며
  멀티모달 예측 모델부터 대규모 데이터 분석까지 다양한 연구를 수행했습니다.
  현재 AI 연구원 및 데이터 사이언티스트로서 새로운 기회를 찾고 있습니다.
