about: >-
  Hi, I’m Janghyun Noh! I received my M.S. in Artificial Intelligence from Myongji University, where I was advised by
  Prof. <a href="https://minsik-bioinfo.github.io/online-cv/">Minsik Oh</a> in the
  <a href="https://ailab-mju.github.io/">Artificial Intelligence and Data Analytics (AIDA) Lab</a>.
  I’m interested in using AI to analyze complex data and solve real-world problems across diverse domains.
  Through collaborations with industry partners, public agencies, and hospitals, I’ve gained broad research experience
  ranging from developing multimodal prediction models to analyzing large-scale datasets.
  I’m currently looking for opportunities as an AI researcher or data scientist.
about_ko: >-
  안녕하세요, 노장현입니다! 저는 명지대학교 <a href="https://ailab-mju.github.io/">인공지능 및 데이터 분석(AIDA) 연구실</a>에서
  <a href="https://minsik-bioinfo.github.io/online-cv/">오민식 교수님</a>의 지도를 받아 인공지능학 석사 학위를 취득했습니다.
  AI를 활용하여 복잡한 데이터를 분석하고 다양한 분야의 실제 문제를 해결하는 데 관심이 있으며,
  기업·공공기관·병원과의 협업을 통해 멀티모달 예측 모델 개발부터 대규모 데이터 분석까지 폭넓은 연구 경험을 쌓았습니다.
  현재 AI 연구자 또는 데이터 사이언티스트로 일할 기회를 찾고 있습니다.
