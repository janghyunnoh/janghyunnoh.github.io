about: >-
  Hi, I'm Janghyun Noh! I received my M.S. in Artificial Intelligence from Myongji University, where I was advised by Prof. <a href="https://minsik-bioinfo.github.io/online-cv/">Minsik Oh</a> in the <a href="https://ailab-mju.github.io/">Artificial Intelligence and Data Analytics (AIDA) Lab</a>.
  I'm interested in using AI to solve real-world problems across diverse domains. Through collaborations with industry partners, public agencies, and hospitals, I've gained experience in understanding domain-specific challenges and practical requirements, and incorporating them into AI model development and data analysis. Building on my research experience and technical expertise, I aim to apply AI to real-world workflows and services to address practical challenges and create meaningful value.
about_ko: >-
  안녕하세요, 노장현입니다! 저는 명지대학교 <a href="https://ailab-mju.github.io/">인공지능 및 데이터 분석(AIDA) 연구실</a>에서 <a href="https://minsik-bioinfo.github.io/online-cv/">오민식 교수님</a>의 지도를 받아 인공지능 석사 학위를 취득했습니다.
  AI를 활용하여 다양한 분야의 실제 문제를 해결하는 데 관심이 있으며, 기업·공공기관·병원과의 협업을 통해 각 분야의 특성과 현업의 요구사항을 이해하고 이를 AI 모델 개발과 데이터 분석에 반영하는 경험을 쌓았습니다. 이러한 연구개발 경험과 기술적 역량을 바탕으로 AI 기술을 실제 업무와 서비스에 적용하여 현장의 문제를 해결하고 새로운 가치를 창출하고자 합니다.
